# Зоны ограничения частоты для GameDevStory (аудит-51 02-P3-9).
# Ставить: /etc/nginx/conf.d/gds-limits.conf (http-контекст), затем nginx -t && systemctl reload nginx.
# Внимание: без этого файла конфиг sites-available/gds (limit_req zone=gds_auth) не пройдёт nginx -t.
limit_req_zone $binary_remote_addr zone=gds_auth:10m rate=30r/m;
limit_req_status 429;
