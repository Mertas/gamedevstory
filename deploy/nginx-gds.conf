# nginx для GameDevStory (plan/19).
# Ставить: /etc/nginx/sites-available/gds → ln -s в sites-enabled, затем nginx -t && systemctl reload nginx
# Если домена пока нет — оставь server_name _; и заходи по http://IP/ (HTTPS появится после DuckDNS/certbot).
server {
    server_name _;

    client_max_body_size 8m;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # важно для cookie сессии (secure включается только на https)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # WebSocket: без Upgrade-заголовков игра не подключится
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
