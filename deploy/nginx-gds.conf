# nginx для GameDevStory (plan/19).
# Ставить: /etc/nginx/sites-available/gds → ln -s в sites-enabled, затем nginx -t && systemctl reload nginx
# Если домена пока нет — оставь server_name _; и заходи по http://IP/ (HTTPS появится после DuckDNS/certbot).
server {
    server_name _;

    # аудит-51 02-P2-5/03-P3-9: не отдаём версию nginx
    server_tokens off;

    client_max_body_size 8m;

    # аудит-51 02-P2-5: security-заголовки (HSTS без includeSubDomains — только этот хост)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # важно для cookie сессии (secure включается только на https)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # WebSocket: без Upgrade-заголовков игра не подключится
    location /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # аудит-51 02-P3-9: тормоз перебора на точках авторизации (30 запросов/мин на IP)
    # зона gds_auth объявляется в /etc/nginx/conf.d/gds-limits.conf (см. deploy/README.md) —
    # без этого файла nginx -t не пройдёт
    location ~ ^/api/auth/(login|register|reset-request|reset-confirm)$ {
        limit_req zone=gds_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Песочница мини-игр: статика из /srv/gds/lab (обновляется deploy-lab.cmd с ПК, см. deploy/README.md)
    location /lab/ {
        alias /srv/gds/lab/;
    }
}
