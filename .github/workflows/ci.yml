# аудит-51 04-P3-4: CI повторяет локальный гейт: сборка контентной БД + полный `pnpm check`
# (typecheck + eslint + тесты + audit:guard). Покрытие не гоним — чтобы CI оставался быстрым.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:build
      - run: pnpm check
